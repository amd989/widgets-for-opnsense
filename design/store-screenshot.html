<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Screenshot</title>
<!--
  Microsoft Store listing screenshot: the three widgets at large size on a Widget Board backdrop,
  in demo mode. Rendered at 960x540 CSS px with device scale 2 for a 1920x1080 PNG
  (see design/capture-store-screenshots.ps1).
-->
<style>
  :root { --board: #1c1c1c; --tile: #2b2b2b; --text-1: #ffffff; --text-2: rgba(255, 255, 255, 0.72); }
  @media (prefers-color-scheme: light) {
    :root { --board: #e9eef3; --tile: #fbfbfb; --text-1: #1a1a1a; --text-2: rgba(0, 0, 0, 0.6); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 540px; overflow: hidden; background: var(--board); }
  body { display: flex; align-items: center; justify-content: center; gap: 14px;
         color: var(--text-1); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .tile { position: relative; width: 302px; height: 464px; border-radius: 8px; overflow: hidden; background: var(--tile); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .titlebar { position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 1; display: flex;
              align-items: center; justify-content: space-between; padding: 0 14px 0 16px;
              pointer-events: none; font-size: 14px; }
  .name { display: flex; align-items: center; gap: 10px; }
  .name img { width: 16px; height: 16px; }
  .more { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: var(--text-2); }
</style>
</head>
<body>
  <script>
    const icon = "../src/OPNsenseWidgets.Package/ProviderAssets/ProviderIcon.png";
    for (const [id, title] of [["DhcpLeases", "DHCP Leases"], ["Traffic", "Traffic"], ["Firewall", "Firewall"]]) {
      document.write(`<div class="tile"><div class="titlebar"><span class="name"><img src="${icon}" alt="">` +
        `<span>${title}</span></span><span class="more">&middot;&middot;&middot;</span></div>` +
        `<iframe title="${title}" src="../src/OPNsenseWidgets.Core/Widgets/${id}/Web/index.html?size=large"></iframe></div>`);
    }
  </script>
</body>
</html>
