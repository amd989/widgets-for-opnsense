<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHCP Leases</title>
<!--
  DHCP Leases widget page (redesign v3, see design/widget-mockup-v3.html).
  Payload (DhcpLeasesWidget.BuildWebData):
    {updatedAt, trackingSince, newWindowMs, activeWindowMs, total,
     leases:[{host, ip, vendor, mac, start, firstSeen, reserved}]}   (newest arrivals first)
  start = last lease (re)start, so it means "online recently", not "joined". firstSeen comes from
  the app's first-seen store (null = already present when tracking started).
  Shared protocol, theme and helpers: ../../Shared/Web/widget.{css,js}.
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../Shared/Web/widget.css">
<style>
  /* ─── Top: summary on the left, 24h activity on the right ─── */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    flex-shrink: 0;
  }
  .summary { flex-shrink: 0; }

  /* Shrinks to give the stats room (large shows three of them). */
  .activity { flex: 0 1 116px; min-width: 64px; }
  .spark-row { height: 26px; display: flex; align-items: flex-end; gap: 1.5px; }
  .spark-bar {
    flex: 1;
    border-radius: 1.5px 1.5px 0 0;
    transition: height 0.4s ease, background-color 0.4s ease;
  }
  .spark-bar.none { background: var(--grid); height: 2px; }
  .spark-bar.low  { background: rgba(var(--green-rgb), 0.18); height: 5px; }
  .spark-bar.med  { background: rgba(var(--green-rgb), 0.30); height: 10px; }
  .spark-bar.high { background: rgba(var(--green-rgb), 0.48); height: 17px; }
  .spark-bar.hot  { background: var(--green); height: 24px; box-shadow: 0 0 8px var(--green-glow); }

  /* ─── Carousel ─── */
  .carousel {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }
  .carousel.dragging { cursor: grabbing; }
  .track {
    display: flex;
    height: 100%;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }
  .carousel.dragging .track { transition: none; }
  .page { flex: 0 0 100%; height: 100%; display: grid; gap: var(--gap); }
  .page .empty { grid-column: 1 / -1; grid-row: 1 / -1; }

  .dev-card {
    background: var(--surface-card);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    padding: 0 10px 0 11px;
    position: relative;
    overflow: hidden;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    transition: background 0.15s;
  }
  .dev-card:hover { background: var(--surface-card-hover); }
  .dev-card.enter { animation: card-in 0.25s ease both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(3px); } }

  /* Accent stripe */
  .dev-card::before {
    content: "";
    position: absolute;
    left: 0; top: 7px; bottom: 7px;
    width: 2px;
    border-radius: 1px;
  }
  .status-new::before { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
  .status-active::before { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
  .status-stale::before { background: var(--gray-dot); }
  .status-reserved::before { background: var(--purple); }

  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; min-width: 0; }
  .card-host {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .status-new .card-host { color: var(--blue); }
  .card-time {
    font-size: 9px; font-family: var(--mono); font-weight: var(--thin);
    color: var(--text-3); flex-shrink: 0; letter-spacing: 0.04em;
  }
  .status-new .card-time { color: var(--blue); opacity: 0.75; }
  .card-rsv {
    font-size: 7px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--purple); background: var(--purple-soft);
    padding: 1px 4px; border-radius: 3px; flex-shrink: 0; align-self: center;
  }

  .card-meta { display: flex; align-items: center; min-width: 0; font-size: 9px; color: var(--text-2); }
  .card-ip {
    font-family: var(--mono); font-size: 9px; color: var(--text-mono);
    letter-spacing: 0.03em; flex-shrink: 0;
  }
  .card-sep { margin: 0 4px; color: var(--text-3); font-size: 6px; flex-shrink: 0; }
  .card-vendor { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card-mac {
    font-family: var(--mono); font-weight: var(--thin); font-size: 8.5px;
    color: var(--text-3); letter-spacing: 0.04em;
  }

  /* ─── Small (300 x ~150): summary + activity on one row, one row of two compact cards ─── */
  .size-small .activity { flex-basis: 96px; }
  .size-small .spark-row { height: 20px; }
  .size-small .spark-bar.low { height: 4px; }
  .size-small .spark-bar.med { height: 8px; }
  .size-small .spark-bar.high { height: 13px; }
  .size-small .spark-bar.hot { height: 18px; }
  .size-small .dev-card { border-radius: 6px; padding: 0 8px 0 9px; gap: 1px; }
  .size-small .dev-card::before { top: 5px; bottom: 5px; }
  .size-small .card-host { font-size: 10.5px; }
  .size-small .card-vendor, .size-small .card-sep { display: none; }
  .size-small .footer { height: 9px; display: flex; justify-content: center; }
  .size-small .footer-meta, .size-small .pager-arrow, .size-small .refresh-btn { display: none; }
  .size-small .dots { padding: 2px 0; }

  /* Reserved stat and MAC line are large-only. */
  body:not(.size-large) .sub-stat.reserved,
  body:not(.size-large) .card-mac { display: none; }
</style>
</head>
<body class="size-medium">
  <div class="app">
    <header class="top">
      <div class="summary">
        <div class="hero">
          <span class="hero-num" id="total">0</span>
          <span class="hero-unit" id="unit">devices</span>
        </div>
        <div class="sub-stats">
          <div class="sub-stat new"><div class="dot b"></div><span class="num" id="new-count">0</span> new</div>
          <div class="sub-stat active"><div class="dot g"></div><span class="num" id="active-count">0</span> active</div>
          <div class="sub-stat reserved"><div class="dot p"></div><span class="num" id="reserved-count">0</span> reserved</div>
        </div>
      </div>
      <div class="activity" title="Devices that joined, per hour">
        <div class="spark-row" id="spark"></div>
        <div class="axis-label"><span>24h</span><span>now</span></div>
      </div>
    </header>

    <main class="carousel" id="carousel">
      <div class="track" id="track"></div>
    </main>

    <footer class="footer">
      <span class="footer-meta" id="updated"></span>
      <div class="pager">
        <button class="pager-arrow" id="prev" type="button" aria-label="Previous page">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 1.5 3 5l3.5 3.5"/></svg>
        </button>
        <div class="dots" id="dots"></div>
        <button class="pager-arrow" id="next" type="button" aria-label="Next page">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5 7 5 3.5 8.5"/></svg>
        </button>
      </div>
      <button class="refresh-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 6a4.2 4.2 0 1 1-1.25-3"/><path d="M10.4 1.4v2.4H8"/></svg>
      </button>
    </footer>
  </div>

<script src="../../Shared/Web/widget.js"></script>
<script>
(() => {
  "use strict";
  const { el, fmt } = Widget;

  const HOUR_MS = 60 * 60 * 1000;
  const MAX_PAGES = 5;               // same cap as the Adaptive Card carousel

  // Minimum card heights per size; rows are fitted to the space and then stretched to fill it.
  const CARD_MIN_HEIGHT = { small: 32, medium: 38, large: 48 };

  const $ = id => document.getElementById(id);
  const sparkRow = $("spark");
  const carousel = $("carousel");
  const track = $("track");
  const dots = $("dots");
  const prevBtn = $("prev");
  const nextBtn = $("next");
  const refreshBtn = $("refresh");

  let pageIndex = 0;
  let pageCount = 1;
  let firstRender = true;

  // From the payload (DhcpLeasesWidget.NewWindow / ActiveWindow / first-seen store).
  let newMs = 24 * HOUR_MS;        // first seen this recently = new
  let activeMs = HOUR_MS;          // lease renewed this recently = online
  let trackingSince = null;        // devices with no firstSeen were already present then

  for (let i = 0; i < 24; i++) sparkRow.appendChild(el("div", "spark-bar none"));

  const isNew = (lease, now) => lease.firstSeen != null && now - lease.firstSeen < newMs;
  const isActive = (lease, now) => lease.start != null && now - lease.start < activeMs;

  function statusOf(lease, now) {
    if (lease.reserved) return "reserved";
    if (isNew(lease, now)) return "new";
    if (isActive(lease, now)) return "active";
    return "stale";
  }

  // How long ago the device joined. Devices that predate tracking show the tracking age with
  // a "+" ("3d+" = at least 3 days), or nothing during the first hour of tracking.
  function joinedLabel(lease, now) {
    if (lease.firstSeen != null) return fmt.relative(lease.firstSeen, now);
    if (trackingSince == null || now - trackingSince < HOUR_MS) return "";
    return fmt.relative(trackingSince, now) + "+";
  }

  function renderSpark(leases, now) {
    // Devices first seen per hour over the last 24h; index 23 = the current hour.
    const buckets = new Array(24).fill(0);
    for (const lease of leases) {
      if (lease.firstSeen == null) continue;
      const hoursAgo = Math.floor((now - lease.firstSeen) / HOUR_MS);
      if (hoursAgo >= 0 && hoursAgo < 24) buckets[23 - hoursAgo]++;
    }
    const max = Math.max(...buckets);
    buckets.forEach((count, i) => {
      const ratio = max ? count / max : 0;
      const level = count === 0 ? "none"
        : ratio > 0.85 ? "hot"
        : ratio > 0.5 ? "high"
        : ratio > 0.25 ? "med"
        : "low";
      const bar = sparkRow.children[i];
      bar.className = "spark-bar " + level;
      bar.title = count + (count === 1 ? " device" : " devices") + " joined " + (i === 23 ? "this hour" : (23 - i) + "h ago");
    });
  }

  function card(lease, now, size, animate) {
    const status = statusOf(lease, now);
    const node = el("div", "dev-card status-" + status + (animate ? " enter" : ""));

    const top = el("div", "card-top");
    top.appendChild(el("span", "card-host", lease.host || lease.ip));
    if (lease.reserved && size !== "small") top.appendChild(el("span", "card-rsv", "rsv"));
    top.appendChild(el("span", "card-time", joinedLabel(lease, now)));
    node.appendChild(top);

    const meta = el("div", "card-meta");
    if (lease.host) meta.appendChild(el("span", "card-ip", lease.ip));
    if (lease.vendor) {
      if (lease.host) meta.appendChild(el("span", "card-sep", "•"));
      meta.appendChild(el("span", "card-vendor", lease.vendor));
    }
    if (meta.childNodes.length) node.appendChild(meta);

    if (lease.mac) node.appendChild(el("div", "card-mac", lease.mac.toLowerCase()));

    const joined = lease.firstSeen != null
      ? "Joined " + new Date(lease.firstSeen).toLocaleString()
      : trackingSince != null ? "Here since before " + new Date(trackingSince).toLocaleString() : null;
    const renewed = lease.start != null ? "Lease renewed " + fmt.relative(lease.start, now) + (fmt.relative(lease.start, now) === "now" ? "" : " ago") : null;
    node.title = [lease.host, lease.ip, lease.vendor, lease.mac, joined, renewed].filter(Boolean).join("\n");
    return node;
  }

  // How many cards fit: rows from the carousel height, 2 columns at board width.
  function pageShape(size) {
    const gap = parseFloat(getComputedStyle(document.body).getPropertyValue("--gap")) || 6;
    const cols = carousel.clientWidth >= 220 ? 2 : 1;
    const minHeight = CARD_MIN_HEIGHT[size] || CARD_MIN_HEIGHT.medium;
    const rows = Math.max(1, Math.floor((carousel.clientHeight + gap) / (minHeight + gap)));
    return { cols, rows, perPage: cols * rows };
  }

  function render(data, size, fresh) {
    refreshBtn.classList.remove("busy");
    const now = Date.now();
    const leases = data.leases || [];
    if (data.newWindowMs) newMs = data.newWindowMs;
    if (data.activeWindowMs) activeMs = data.activeWindowMs;
    trackingSince = data.trackingSince ?? null;

    let newCount = 0, activeCount = 0, reservedCount = 0;
    for (const lease of leases) {
      if (lease.reserved) reservedCount++;
      if (isNew(lease, now)) newCount++;
      if (isActive(lease, now)) activeCount++;
    }

    const total = data.total ?? leases.length;
    $("total").textContent = total;
    $("unit").textContent = total === 1 ? "device" : "devices";
    $("new-count").textContent = newCount;
    $("active-count").textContent = activeCount;
    $("reserved-count").textContent = reservedCount;
    $("updated").textContent = fmt.time(data.updatedAt);

    renderSpark(leases, now);

    // Carousel pages that exactly fill the available space.
    const { cols, rows, perPage } = pageShape(size);
    const shown = leases.slice(0, perPage * MAX_PAGES);
    const pages = [];
    for (let i = 0; i < shown.length; i += perPage) pages.push(shown.slice(i, i + perPage));

    const fragment = document.createDocumentFragment();
    if (pages.length === 0) {
      const page = el("div", "page");
      page.appendChild(el("div", "empty", "No active leases"));
      fragment.appendChild(page);
    }
    for (const items of pages) {
      const page = el("div", "page");
      page.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      page.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
      for (const lease of items) page.appendChild(card(lease, now, size, fresh && firstRender));
      fragment.appendChild(page);
    }
    track.replaceChildren(fragment);
    firstRender = false;

    pageCount = Math.max(1, pages.length);
    goTo(Math.min(pageIndex, pageCount - 1), false);
    carousel.title = (shown.length < total ? `${shown.length} of ${total}` : `${total}`) + (total === 1 ? " device" : " devices");
  }

  function renderDots() {
    dots.replaceChildren();
    if (pageCount <= 1) return;
    for (let i = 0; i < pageCount; i++) {
      const dot = el("button", i === pageIndex ? "active" : "");
      dot.type = "button";
      dot.setAttribute("aria-label", "Page " + (i + 1));
      dot.addEventListener("click", () => goTo(i, true));
      dots.appendChild(dot);
    }
  }

  function goTo(index, animated) {
    pageIndex = Math.max(0, Math.min(index, pageCount - 1));
    if (!animated) track.style.transition = "none";
    track.style.transform = `translateX(${-pageIndex * 100}%)`;
    if (!animated) {
      track.getBoundingClientRect(); // apply without animating
      track.style.transition = "";
    }
    prevBtn.disabled = pageIndex === 0;
    nextBtn.disabled = pageIndex >= pageCount - 1;
    prevBtn.style.visibility = nextBtn.style.visibility = pageCount > 1 ? "visible" : "hidden";
    renderDots();
  }

  prevBtn.addEventListener("click", () => goTo(pageIndex - 1, true));
  nextBtn.addEventListener("click", () => goTo(pageIndex + 1, true));

  // Swipe / drag between pages.
  let dragStartX = null, dragDx = 0;
  carousel.addEventListener("pointerdown", e => {
    if (pageCount <= 1) return;
    dragStartX = e.clientX;
    dragDx = 0;
    carousel.setPointerCapture(e.pointerId);
  });
  carousel.addEventListener("pointermove", e => {
    if (dragStartX === null) return;
    dragDx = e.clientX - dragStartX;
    if (Math.abs(dragDx) > 3) carousel.classList.add("dragging");
    const atEdge = (pageIndex === 0 && dragDx > 0) || (pageIndex === pageCount - 1 && dragDx < 0);
    const offset = atEdge ? dragDx / 3 : dragDx;
    track.style.transform = `translateX(calc(${-pageIndex * 100}% + ${offset}px))`;
  });
  const endDrag = () => {
    if (dragStartX === null) return;
    carousel.classList.remove("dragging");
    const threshold = carousel.clientWidth * 0.18;
    const target = dragDx < -threshold ? pageIndex + 1 : dragDx > threshold ? pageIndex - 1 : pageIndex;
    dragStartX = null;
    goTo(target, true);
  };
  carousel.addEventListener("pointerup", endDrag);
  carousel.addEventListener("pointercancel", endDrag);

  // Horizontal wheel / touchpad swipe. Vertical wheel is left to the board.
  let wheelLock = 0;
  carousel.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 15) return;
    e.preventDefault();
    const now = Date.now();
    if (now < wheelLock) return;
    wheelLock = now + 450;
    goTo(pageIndex + (e.deltaX > 0 ? 1 : -1), true);
  }, { passive: false });

  refreshBtn.addEventListener("click", () => {
    refreshBtn.classList.add("busy");
    Widget.refresh();
  });

  // Keep relative times and statuses current between refreshes.
  setInterval(Widget.rerender, 30 * 1000);

  Widget.start({ render, demo: demoData });

  // Demo data for previewing the page outside the Widget Board.
  function demoData() {
    const now = Date.now(), m = 60 * 1000, h = 60 * m, d = 24 * h;
    const rows = [
      ["camera-e1-cd04", "192.168.1.191", "Reolink", "ec:71:db:2e:cd:04", 0.5 * m],
      ["mac", "192.168.1.250", "Apple", "a4:83:e7:2f:01:cc", 1 * m],
      ["living-room-tv", "192.168.1.103", "Samsung", "f4:7b:09:1a:88:d3", 4 * m],
      ["iphone-alex", "192.168.1.55", "Apple", "82:c1:a0:7e:44:f9", 30 * m],
      [null, "192.168.1.150", "Espressif", "24:0a:c4:11:22:33", 40 * m],
      ["proxmox-node1", "192.168.1.10", "Supermicro", "ac:1f:6b:02:37:e8", 57 * m, true],
      ["ring-doorbell", "192.168.1.88", "Amazon", "50:dc:e7:a3:00:b2", 2 * h],
      ["wyze-bulb-2", "192.168.1.32", "Espressif", "2c:aa:8e:10:20:30", 3 * h],
      ["mk35s", "192.168.1.94", "Espressif", "84:f3:eb:01:02:03", 5 * h],
      ["echo-show-5", "192.168.1.165", "Amazon", "44:00:49:aa:bb:cc", 7 * h],
      ["esp32-bluetooth", "192.168.1.52", "Espressif", "24:6f:28:aa:01:52", 9 * h],
      ["mas4004b2c15", "192.168.1.168", "GD Midea", "38:1f:8d:4b:2c:15", 11 * h],
      ["clusterfox", "192.168.1.197", "ASIX", "00:0e:c6:44:19:97", 14 * h],
      ["doorbell", "192.168.1.215", "Lumi United", "54:ef:44:01:02:15", 16 * h],
      [null, "192.168.1.48", "Sony", "fc:f1:52:00:01:48", 19 * h],
      ["ecobee-thermo", "192.168.1.91", "Ecobee", "44:61:32:ff:cc:90", 1 * d],
      ["hp-laserjet", "192.168.1.200", "HP", "3c:d9:2b:55:11:a7", 2 * d],
      ["nest-hub", "192.168.1.77", "Google", "48:d6:d5:e0:33:c1", 2 * d],
      ["unifi-ap-lr", "192.168.1.5", "Ubiquiti", "fc:ec:da:bb:19:44", 3 * d, true],
      ["roku-bedroom", "192.168.1.112", "Roku", "d8:31:34:aa:7c:ee", 3 * d]
    ];
    // The listed age is when the device joined; anything older than 12h predates tracking.
    // Most leases renewed recently (KEA style); a few have gone quiet.
    return {
      updatedAt: now,
      trackingSince: now - 4 * d,
      newWindowMs: 24 * h,
      activeWindowMs: h,
      total: 64,
      leases: rows
        .map(([host, ip, vendor, mac, age, reserved], i) => ({
          host, ip, vendor, mac, reserved: !!reserved,
          firstSeen: age < 12 * h ? now - age : null,
          start: i % 5 === 4 ? now - 3 * h : now - Math.min(age, (i * 7 % 30) * m)
        }))
        .sort((a, b) => (b.firstSeen ?? -Infinity) - (a.firstSeen ?? -Infinity) || b.start - a.start)
    };
  }
})();
</script>
</body>
</html>
